[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "PGPCbot"
dynamic = ["version"]
description = "Bots for PGP Chat: the whole Bot API, end-to-end encryption included."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PGP Chat" }]
keywords = ["pgp-chat", "bot", "bot-api", "openpgp", "end-to-end-encryption", "asyncio", "webhook", "chatbot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
# httpx2: the maintained fork of httpx 0.28 (same API). pysequoia: Sequoia PGP,
# seals and opens. rpgp-py: makes keys phones can always read and checks the
# signatures inside compressed messages. See docs/RESEARCH.md.
dependencies = [
    "httpx2>=2.13.1,<3",
    "pysequoia>=0.1.35,<0.2",
    "rpgp-py>=0.20,<0.21",
]

[project.optional-dependencies]
# an ASGI server for the webhook app; FastAPI or Starlette are never required
webhook = ["uvicorn>=0.30"]
http2 = ["httpx2[http2]>=2.13.1,<3"]

[project.scripts]
pgpcbot = "pgpcbot.__main__:main"

[project.urls]
Homepage = "https://pgpchat.app"
Source = "https://github.com/vntcore/PGPCbot"
Documentation = "https://vntcore.github.io/PGPCbot/"
Issues = "https://github.com/vntcore/PGPCbot/issues"
Changelog = "https://github.com/vntcore/PGPCbot/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "coverage[toml]>=7.16",
    "starlette>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
lint = [
    "ruff>=0.16",
    "mypy>=2.4",
]
docs = [
    # Sphinx 9 needs Python 3.12; on 3.11 pip settles on 8.2, which builds the same site
    "sphinx>=8.2,<10",
    "myst-parser>=5.1,<6",
    "furo>=2025.12.19",
    "sphinx-copybutton>=0.5.2,<0.6",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "build>=1.6",
    "twine>=7.0",
]

[tool.hatch.version]
path = "src/pgpcbot/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pgpcbot"]
# 2.5 is fine for PyPI and pip >= 23.3, but older twine and some private
# mirrors still refuse it, and nothing here needs it
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE",
]
exclude = ["/docs/_build", "**/__pycache__"]
core-metadata-version = "2.4"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
strict_markers = true
strict_config = true
xfail_strict = true
addopts = ["-ra"]
markers = [
    "integration: talks to a real PGP Chat server started from PGPCBOT_SERVER_DIR",
    "interop: needs Java and the PGPainless jars listed in PGPCBOT_PGPAINLESS_CP",
]
filterwarnings = [
    "error",
    # uvicorn and websockets deprecations are theirs to fix, not ours
    "ignore::DeprecationWarning:uvicorn.*",
    "ignore::DeprecationWarning:websockets.*",
]

[tool.coverage.run]
branch = true
source_pkgs = ["pgpcbot"]
omit = ["*/pgpcbot/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
extend-select = ["ASYNC", "B", "BLE", "C4", "D", "I", "N", "PERF", "PT", "RUF", "S", "SIM", "UP"]
ignore = [
    "S101",   # assert is used for invariants the type checker can't see
    "S311",   # random is for jitter, not for secrets
    "RUF022", # __all__ is grouped by meaning, not sorted
    "SIM105", # contextlib.suppress isn't always clearer
    "D105",   # __repr__, __aenter__ and friends are described by their class
]

[tool.ruff.lint.pydocstyle]
# the docstrings are the API reference: Sphinx reads them with napoleon
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "BLE001", "N806", "D"]
"examples/**" = ["T201", "S", "D"]
"scripts/**" = ["D"]
"docs/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unreachable = true
files = ["src/pgpcbot"]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["pysequoia", "pysequoia.*", "openpgp", "openpgp.*"]
follow_imports = "skip"
ignore_missing_imports = true
