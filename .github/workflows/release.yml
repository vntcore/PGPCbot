name: release

# Builds on a version tag, then publishes through the "pypi" environment.
# Two things have to be set up once, in the repository and on PyPI, or the
# first tag fails on the publish job: required reviewers on that environment
# (GitHub creates it unprotected the first time it is referenced, so without
# them nothing holds the publish back), and a pending trusted publisher for
# this project (owner, repo, release.yml, environment pypi) - a project that
# has never been uploaded has nothing for OIDC to match against.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip build "twine>=7"
      - name: the tag matches the package version
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'\"(.+)\"', pathlib.Path('src/pgpcbot/_version.py').read_text()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/PGPCbot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
